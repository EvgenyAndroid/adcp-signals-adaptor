name = "adcp-signals-adaptor"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT          = "production"
API_VERSION          = "3.1"
EMBEDDING_ENGINE     = "llm"
LINKEDIN_REDIRECT_URI = "https://adcp-signals-adaptor.evgeny-193.workers.dev/auth/linkedin/callback"
# AdCP 3.2 (src/types/env.ts). Only the exact string "true" turns it on.
# Flipping it moves hosted grading to the 3.2 bundle and replaces the 3.1
# card, so the flip is a reviewed PR of its own. `wrangler deploy` replaces
# dashboard vars, so this line is the source of truth. Local runs:
# `wrangler dev --var SERVE_ADCP_3_2:true`.
SERVE_ADCP_3_2       = "false"
# DEMO_API_KEY is provisioned via `wrangler secret put DEMO_API_KEY` — do NOT
# add it here. Checked-in vars land in the public Worker bundle, which makes
# a plaintext API key in [vars] equivalent to having no auth. Secrets are
# injected at runtime and never appear in the bundle.
# GRADER_API_KEY (optional) is a secret too — `wrangler secret put
# GRADER_API_KEY`, never added here: a PRIVATE sandbox bearer for AAO's hosted
# grader, accepted on MCP tools/call only (src/types/env.ts, README "Deploying").

[[d1_databases]]
binding       = "DB"
database_name = "adcp-signals-db"
database_id   = "70b0049e-7012-4c3a-8bd2-0f0a9c74d79c"

[[kv_namespaces]]
binding = "SIGNALS_CACHE"
id      = "e17c4c99b649460a92016e1257436f22"

[dev]
port           = 8787
local_protocol = "http"

# 2026-10-10: every bare `crypto` import in the bundle resolves to this shim
# (node:crypto re-exported, `verify` fixed for workerd's ES256 call shape).
# It exists for the @adcp/sdk request verifier only — see its header.
[alias]
"crypto" = "./src/shims/crypto.ts"

# Sec-40: weekly D1 housekeeping purge.
# Schedule: Sundays 06:00 UTC (01:00 ET / 22:00 PT Saturday).
# The scheduled() handler in src/index.ts invokes runScheduledPurge which
# sweeps: dynamic signals (>7d), activation_jobs + events (>30d),
# mcp_tool_calls (>7d, matches ext.governance.audit_log.retention_days),
# expired OAuth state and expired request-signing nonces.
# Canonical seeded/derived signals are preserved.
# Manual trigger available via POST /admin/purge (DEMO_API_KEY gated).
[triggers]
# Two cron schedules:
#   "0 6 * * SUN" — weekly D1 purge (existing).
#   "0 4 * * *"   — daily registry-sync (MVP #4): diffs /api/registry/agents
#                   against AGENT_REGISTRY and writes the report to KV under
#                   `registry_diff_report`. UI surfaces the latest report on
#                   the Canvas registry-sync bar.
crons = ["0 6 * * SUN", "0 4 * * *"]